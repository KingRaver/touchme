[project]
name = "td-mcp"
version = "0.0.0"
description = "Local MCP server for TouchDesigner (stdio server, HTTP bridge)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx>=0.28,<1",
    # typing_extensions.TypedDict, not typing.TypedDict, for pydantic's schema generation on
    # Python < 3.12 (src/td_mcp/schemas.py). Already a transitive dep; pinned explicitly
    # because the server imports it directly.
    "typing-extensions>=4.12,<5",
    # td_capture_contact_sheet decodes each cell the bridge returns and tiles them into one
    # image on the server side (not inside TouchDesigner's main thread).
    "pillow>=13.0.0",
]

[project.scripts]
td-mcp = "td_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/td_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Runs inside TouchDesigner: op/parent/app/constantTOP are injected globals.
"bridge/src/*.py" = ["F821", "UP031", "BLE001", "W191", "E101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a live TouchDesigner with the bridge loaded (opt-in)"]

[tool.pyright]
include = ["src", "tests", "bridge"]
