name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      # Unit tests only (pyproject.toml's addopts already excludes the `integration` marker).
      # Includes tests/unit/test_build_spike.py, which guards the bridge .tox against ever
      # embedding a script older than bridge/src/callbacks.py (the prior-art bug recorded in
      # research/PRIOR_ART_TOUCHDESIGNER_MCP.md, finding 3) without needing TouchDesigner.
      - name: Unit tests
        run: uv run pytest -v

  # Integration tests (tests/integration/) need a licensed, running TouchDesigner with the
  # built bridge loaded (specs/ARCHITECTURE.md, "Quality bar"; plans/TD_MCP_BUILD.md,
  # "Risks"). They are intentionally not run here. Run them locally:
  #   python3 bridge/build_spike.py --test-fixtures   # then open the .tox in TouchDesigner
  #   export TD_MCP_TOKEN_FILE=$PWD/bridge/build/token.txt
  #   uv run pytest tests/integration -m integration -p no:cacheprovider
